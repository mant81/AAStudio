[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aastudio"
version = "0.1.0"
description = "AAStudio local analysis workstation scaffold"
requires-python = ">=3.11"

[project.scripts]
aastudio = "aastudio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
