<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="project-detail-body">
<div class="detail-page detail-layout" data-project-shell th:attr="data-project-id=${projectId}">
    <aside class="detail-sidebar">
        <div class="detail-sidebar-head">
            <a class="brand" th:href="@{/project}">
                <span class="brand-mark">✦</span>
                <span>Project Studio</span>
            </a>
            <div class="detail-sidebar-project">
                <p class="eyebrow tiny">Project</p>
                <strong data-project-name>Project</strong>
                <p data-project-description>프로젝트 설명이 없습니다.</p>
            </div>
        </div>

        <nav class="detail-menu" data-section-tabs>
            <button class="detail-menu-item active" type="button" data-section-tab="diagram">다이어그램</button>
            <button class="detail-menu-item" type="button" data-section-tab="database">DB 모델링</button>
            <button class="detail-menu-item" type="button" data-section-tab="api-docs">API 정의</button>
            <button class="detail-menu-item" type="button" data-section-tab="wiki">Wiki</button>
        </nav>

        <div class="detail-sidebar-card">
            <span>Status</span>
            <strong data-project-status>Draft</strong>
        </div>
        <div class="detail-sidebar-card">
            <span>Created</span>
            <strong data-project-created>-</strong>
        </div>
        <div class="detail-sidebar-card">
            <span>Updated</span>
            <strong data-project-updated>-</strong>
        </div>

        <div class="detail-sidebar-footer">
            <a class="secondary-btn" th:href="@{/project}">Back to projects</a>
        </div>
    </aside>

    <main class="detail-main">
        <header class="detail-topbar">
            <div>
                <p class="eyebrow tiny">Workspace</p>
                <h1 data-project-name>Project</h1>
                <p class="detail-kicker">좌측 메뉴를 기준으로 섹션이 고정되어 전환됩니다.</p>
            </div>
            <div class="detail-topbar-actions">
                <button class="primary-btn" type="button" data-continue-work>Continue work</button>
            </div>
        </header>

        <section class="detail-content card">
            <div class="section-toolbar">
                <div class="section-toolbar-left">
                    <span class="toolbar-dot red"></span>
                    <span class="toolbar-dot amber"></span>
                    <span class="toolbar-dot green"></span>
                </div>
                <div class="section-toolbar-title" data-section-title>Diagram Editor</div>
                <div class="section-toolbar-right" data-section-toolbar></div>
            </div>

            <div class="section-stack">
                <div th:replace="~{project-detail/diagram-panel :: diagramPanel}"></div>
                <div th:replace="~{project-detail/database-panel :: databasePanel}"></div>
                <div th:replace="~{project-detail/api-panel :: apiPanel}"></div>
                <div th:replace="~{project-detail/wiki-panel :: wikiPanel}"></div>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/section-common.js}"></script>
<script th:src="@{/js/diagram-editor.js}"></script>
<script th:src="@{/js/database-editor.js}"></script>
<script th:src="@{/js/api-editor.js}"></script>
<script th:src="@{/js/wiki-editor.js}"></script>
</body>
</html>
