<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="project-new-body">
<div class="simple-page">
    <div class="card simple-card form-card">
        <p class="eyebrow">Create Project</p>
        <h1>New Project</h1>
        <p class="muted">이름과 설명을 입력하면 로컬스토리지에 저장되고 프로젝트 화면으로 이동합니다.</p>
        <form class="project-form" data-project-create-form>
            <label>
                <span>Name</span>
                <input class="text-input" type="text" name="name" placeholder="프로젝트 이름">
            </label>
            <label>
                <span>Description</span>
                <textarea class="text-area" rows="4" name="description" placeholder="프로젝트 설명"></textarea>
            </label>
            <div class="form-actions">
                <button class="primary-btn" type="submit">Create</button>
                <a class="secondary-btn" th:href="@{/project}">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
