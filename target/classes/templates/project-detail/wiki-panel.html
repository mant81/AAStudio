<section class="section-panel" data-section-panel="wiki" th:fragment="wikiPanel">
    <div class="editor-shell" data-wiki-shell>
        <div class="editor-toolbar">
            <div>
                <p class="eyebrow tiny">Wiki</p>
                <h2>Wiki 편집</h2>
                <p>프로젝트 문서를 페이지 단위로 정리합니다.</p>
            </div>
            <div class="editor-toolbar-actions">
                <button class="ghost-btn" type="button" data-wiki-page-add>페이지 추가</button>
                <button class="ghost-btn" type="button" data-wiki-page-delete>페이지 삭제</button>
                <button class="primary-btn" type="button" data-save-section="wiki">저장</button>
            </div>
        </div>
        <div class="wiki-layout">
            <aside class="editor-panel">
                <div class="panel-title-row">
                    <strong>페이지</strong>
                    <span class="panel-count">Tree</span>
                </div>
                <div class="wiki-tree" data-wiki-tree></div>
            </aside>
            <div class="wiki-content">
                <div class="wiki-block title" data-wiki-title>Page title</div>
                <div class="wiki-block">
                    <div class="form-grid">
                        <label class="field"><span>제목</span><input class="text-input" type="text" data-wiki-page-title></label>
                        <label class="field"><span>내용</span><textarea class="text-input wiki-editor" rows="14" data-wiki-page-content></textarea></label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
