<section class="section-panel" data-section-panel="diagram" th:fragment="diagramPanel">
    <div class="editor-shell" data-diagram-shell>
        <div class="editor-toolbar">
            <div>
                <p class="eyebrow tiny">Diagram</p>
                <h2>다이어그램 편집</h2>
                <p>프로젝트 구조를 노드와 메모로 정리합니다.</p>
            </div>
            <div class="editor-toolbar-actions">
                <button class="ghost-btn" type="button" data-diagram-add-node>노드 추가</button>
                <button class="ghost-btn" type="button" data-diagram-delete-node>노드 삭제</button>
                <button class="primary-btn" type="button" data-save-section="diagram">저장</button>
            </div>
        </div>
        <div class="diagram-workbench">
            <aside class="editor-panel">
                <div class="panel-title-row">
                    <strong>노드 목록</strong>
                    <span class="panel-count" data-diagram-node-count>0</span>
                </div>
                <div class="mini-nav" data-diagram-node-list></div>
            </aside>
            <div class="editor-stage">
                <div class="diagram-canvas-head">
                    <div>
                        <p class="eyebrow tiny">Canvas</p>
                        <strong data-diagram-active-title>선택된 노드 없음</strong>
                    </div>
                    <div class="canvas-actions">
                        <button class="ghost-btn" type="button" data-diagram-center>중앙 정렬</button>
                    </div>
                </div>
                <div class="diagram-canvas-shell">
                    <div class="mock-canvas large" data-diagram-canvas></div>
                </div>
            </div>
            <aside class="editor-panel">
                <div class="panel-title-row">
                    <strong>속성</strong>
                    <span class="panel-count">Edit</span>
                </div>
                <div class="form-grid">
                    <label class="field">
                        <span>이름</span>
                        <input class="text-input" type="text" data-diagram-node-name placeholder="Node name">
                    </label>
                    <label class="field">
                        <span>타입</span>
                        <select class="text-input" data-diagram-node-type>
                            <option value="page">Page</option>
                            <option value="database">Database</option>
                            <option value="gateway">Gateway</option>
                            <option value="note">Note</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>설명</span>
                        <textarea class="text-input" rows="4" data-diagram-node-desc placeholder="Node description"></textarea>
                    </label>
                </div>
            </aside>
        </div>
    </div>
</section>
