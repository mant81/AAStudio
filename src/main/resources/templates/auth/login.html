<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('AAStudio Login')}"></head>
<body>
<main class="login-shell">
    <section class="login-card">
        <div class="eyebrow">AAStudio</div>
        <h1>Sign in</h1>
        <p class="lead">Enter the workspace with a clean, focused dashboard experience.</p>
        <div class="form-alert error" th:if="${param.error}">아이디 또는 비밀번호를 확인하세요.</div>
        <div class="form-alert success" th:if="${param.logout}">안전하게 로그아웃되었습니다.</div>
        <form th:action="@{/login}" method="post" class="stack">
            <label>
                <span>Username</span>
                <input type="text" name="username" placeholder="admin" autocomplete="username" required autofocus />
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" placeholder="Password" autocomplete="current-password" required />
            </label>
            <button type="submit">Login</button>
        </form>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
