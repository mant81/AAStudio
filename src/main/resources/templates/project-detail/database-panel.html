<section class="section-panel" data-section-panel="database" th:fragment="databasePanel">
    <div class="editor-shell" data-db-shell>
        <div class="editor-toolbar">
            <div>
                <p class="eyebrow tiny">DB Modeling</p>
                <h2>DB 모델링 편집</h2>
                <p>테이블, 컬럼, 관계를 함께 관리합니다.</p>
            </div>
            <div class="editor-toolbar-actions">
                <button class="ghost-btn" type="button" data-db-add-table>테이블 추가</button>
                <button class="primary-btn" type="button" data-save-section="database">저장</button>
            </div>
        </div>
        <div class="db-layout">
            <aside class="editor-panel">
                <div class="panel-title-row">
                    <strong>테이블</strong>
                    <span class="panel-count">List</span>
                </div>
                <div class="db-legend" data-db-table-list></div>
            </aside>
            <div class="editor-stage">
                <div class="db-canvas" data-db-canvas></div>
            </div>
            <aside class="editor-panel db-detail">
                <div class="panel-title-row">
                    <strong>테이블 편집</strong>
                    <span class="panel-count">Form</span>
                </div>
                <div class="form-grid">
                    <label class="field"><span>이름</span><input class="text-input" type="text" data-db-table-name></label>
                    <label class="field"><span>설명</span><textarea class="text-input" rows="3" data-db-table-description></textarea></label>
                    <label class="field"><span>색상</span><input class="text-input" type="text" data-db-table-color placeholder="#0f172a"></label>
                </div>
                <div class="panel-actions">
                    <button class="ghost-btn" type="button" data-db-table-save>테이블 저장</button>
                    <button class="danger-btn" type="button" data-db-table-delete>삭제</button>
                </div>
                <div class="panel-separator"></div>
                <div class="panel-title-row">
                    <strong>컬럼 편집</strong>
                    <span class="panel-count">Field</span>
                </div>
                <div class="form-grid">
                    <label class="field"><span>이름</span><input class="text-input" type="text" data-db-column-name></label>
                    <label class="field"><span>타입</span><input class="text-input" type="text" data-db-column-type value="VARCHAR"></label>
                    <label class="field"><span>길이</span><input class="text-input" type="number" data-db-column-length></label>
                    <label class="field"><span>기본값</span><input class="text-input" type="text" data-db-column-default></label>
                </div>
                <div class="panel-actions">
                    <button class="ghost-btn" type="button" data-db-column-add>컬럼 추가</button>
                    <button class="ghost-btn" type="button" data-db-column-save>컬럼 저장</button>
                    <button class="danger-btn" type="button" data-db-column-delete>삭제</button>
                </div>
                <div class="panel-separator"></div>
                <div class="panel-title-row">
                    <strong>관계</strong>
                    <span class="panel-count">FK</span>
                </div>
                <div class="form-grid">
                    <label class="field"><span>출발 컬럼</span><select class="text-input" data-db-rel-source></select></label>
                    <label class="field"><span>타겟 테이블</span><select class="text-input" data-db-rel-target-table></select></label>
                    <label class="field"><span>타겟 컬럼</span><select class="text-input" data-db-rel-target-column></select></label>
                </div>
                <div class="panel-actions">
                    <button class="ghost-btn" type="button" data-db-rel-save>관계 저장</button>
                </div>
                <div class="panel-title-row">
                    <strong>컬럼 목록</strong>
                </div>
                <div class="node-list" data-db-column-list></div>
            </aside>
        </div>
    </div>
</section>
