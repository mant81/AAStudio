<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Project Editor')}"></head>
<body>
<div th:replace="~{layout/shell :: topbar}"></div>
<main class="page-shell">
    <section class="hero-card">
        <div class="eyebrow">Project</div>
        <h1>Project Editor</h1>
        <p class="lead">Update project identity, summary, and current status.</p>
        <form th:action="@{/projects/{id}(id=${projectForm.id})}" method="post" class="stack">
            <label>
                <span>Name</span>
                <input type="text" name="name" th:value="${projectForm.name}" />
            </label>
            <label>
                <span>Description</span>
                <input type="text" name="description" th:value="${projectForm.description}" />
            </label>
            <label><span>Source root</span><input type="text" name="rootPath" th:value="${projectForm.rootPath}" /></label>
            <label><span>Current stage</span><input type="text" name="currentStage" th:value="${projectForm.currentStage}" /></label>
            <label>
                <span>Status</span>
                <input type="text" name="status" th:value="${projectForm.status}" />
            </label>
            <button type="submit">Save</button>
        </form>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
