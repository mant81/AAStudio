<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Code Group Form')}"></head>
<body>
<div th:replace="~{layout/shell :: topbar}"></div>
<main class="page-shell">
    <section class="hero-card">
        <div class="eyebrow">Admin</div>
        <h1>Edit Code Group</h1>
        <form th:action="@{/code-groups/{id}(id=${codeGroupForm.id})}" method="post" class="stack">
            <label><span>Group Code</span><input type="text" name="groupCode" th:value="${codeGroupForm.groupCode}" /></label>
            <label><span>Group Name</span><input type="text" name="groupName" th:value="${codeGroupForm.groupName}" /></label>
            <label><span>Description</span><input type="text" name="description" th:value="${codeGroupForm.description}" /></label>
            <label><span>Enabled</span><input type="text" name="enabled" th:value="${codeGroupForm.enabled}" /></label>
            <button type="submit">Save</button>
        </form>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
