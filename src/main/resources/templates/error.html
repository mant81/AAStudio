<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('AAStudio Error')}"></head>
<body>
<div th:replace="~{layout/shell :: topbar}"></div>
<main class="page-shell">
    <section class="hero-card">
        <div class="eyebrow">Request could not be completed</div>
        <h1><span th:text="${status}">400</span> Error</h1>
        <p class="lead" th:text="${message}">요청 처리 중 문제가 발생했습니다.</p>
        <p class="muted-path" th:text="${path}">/path</p>
        <div class="action-row">
            <button class="ghost-button" type="button" data-history-back>Go back</button>
            <a class="ghost-button" th:href="@{/}">Dashboard</a>
        </div>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
