<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | AAStudio Core'">AAStudio Core</title>
    <style>
        @layer base {
            html, body { margin: 0; padding: 0; }
            body { overscroll-behavior: none; }
            main > :first-child { margin-top: 0 !important; }
            main > :last-child { margin-bottom: 0 !important; }
            .sidebar-transition { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            .content-transition { transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        }
        ::-webkit-scrollbar { display: none; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "on-primary-container": "#7c839b",
                        "secondary-fixed": "#cde5ff",
                        "surface-white": "#FFFFFF",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#75859d",
                        "on-secondary-container": "#004f7b",
                        "secondary-fixed-dim": "#94ccff",
                        "on-secondary-fixed": "#001d32",
                        "secondary": "#006399",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#000000",
                        "on-background": "#191c1e",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-primary": "#bec6e0",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#0b1c30",
                        "outline-variant": "#c6c6cd",
                        "surface-container": "#eceef0",
                        "outline": "#76777d",
                        "surface-variant": "#e0e3e5",
                        "tertiary-container": "#0b1c30",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#d3e4fe",
                        "surface": "#f7f9fb",
                        "accent-api": "#8B5CF6",
                        "surface-tint": "#565e74",
                        "on-primary-fixed": "#131b2e",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#45464d",
                        "secondary-container": "#7bc2ff",
                        "background": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#38485d",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed": "#dae2fd",
                        "surface-container-high": "#e6e8ea",
                        "accent-logic": "#F59E0B",
                        "on-secondary-fixed-variant": "#004b74",
                        "primary-container": "#131b2e",
                        "surface-dim": "#d8dadc",
                        "primary-fixed-dim": "#bec6e0",
                        "inverse-surface": "#2d3133",
                        "accent-db": "#10B981",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#3f465c",
                        "primary": "#000000",
                        "surface-bright": "#f7f9fb"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        "sidebar-width": "260px",
                        "header-height": "64px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px",
                        "unit": "4px"
                    },
                    fontFamily: {
                        "code-sm": ["JetBrains Mono"],
                        "headline-lg": ["Geist"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Geist"],
                        "title-md": ["Geist"],
                        "display-lg": ["Geist"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    fontSize: {
                        "code-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "title-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "500" }]
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-background font-body-md text-on-background">
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar(${activeNav}, ${navigationItems})}"></aside>
    <div class="content-transition pl-20 group-[.collapsed]/sidebar:pl-20" id="content-wrapper">
        <header th:replace="~{fragments/header :: header}"></header>
        <main class="relative pt-header-height bg-surface min-h-screen" th:insert="${content}"></main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:if="${activeNav == 'diagram'}" th:src="@{/js/diagram.js}"></script>
</body>
</html>
