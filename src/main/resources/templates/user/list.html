<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Users')}"></head>
<body>
<div th:replace="~{layout/shell :: topbar}"></div>
<main class="page-shell">
    <section class="hero-card">
        <div class="eyebrow">Admin</div>
        <h1>User Management</h1>
        <p class="lead">Create and review internal users for authenticated access.</p>
        <div class="summary-row">
            <div class="summary-card">
                <strong th:text="${userCount}">0</strong>
                <span>Users</span>
            </div>
        </div>
    </section>
    <section class="hero-card">
        <h2>New User</h2>
        <p class="lead">Register a new authenticated user and assign a role.</p>
        <form th:action="@{/users}" method="post" class="stack">
            <label><span>Username</span><input type="text" name="username" /></label>
            <label><span>Password</span><input type="password" name="password" /></label>
            <label><span>Role</span><select name="roleName"><option>EDITOR</option><option>READONLY</option><option>OWNER</option><option>ADMIN</option></select></label>
            <button type="submit">Create User</button>
        </form>
    </section>
    <section class="hero-card">
        <h2>Search Users</h2>
        <form th:action="@{/users}" method="get" class="stack">
            <label>
                <span>Keyword</span>
                <input type="text" name="q" th:value="${query}" placeholder="username, role, or enabled" />
            </label>
            <button type="submit">Search</button>
        </form>
    </section>
    <section class="grid">
        <article class="card" th:if="${#lists.isEmpty(users)}">
            <h2>No users yet</h2>
            <p>Add the first account to begin access management.</p>
        </article>
        <article class="card" th:each="user : ${users}">
            <h2><a th:href="@{/users/{id}/edit(id=${user.id})}" th:text="${user.username}">username</a></h2>
            <p th:text="${user.roleName}">role</p>
            <small th:text="${user.enabled}">enabled</small>
            <div class="action-row">
                <a class="ghost-button" th:href="@{/users/{id}/edit(id=${user.id})}">Edit</a>
                <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post">
                    <button type="submit" class="danger-button">Delete</button>
                </form>
            </div>
        </article>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
