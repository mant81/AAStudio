<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AAStudio Project</title>
    <link href="../assets/remixicon/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-backdrop" aria-hidden="true"></div>

    <main class="app-shell" aria-label="AAStudio project shell">
      <header class="topbar" aria-label="상단 헤더">
        <div class="topbar__brand">
          <span class="brand-mark" role="img" aria-label="AAStudio architecture logo">
            <svg viewBox="0 0 160 120" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="aas-dark" x1="18" y1="108" x2="90" y2="18" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#0a2a78" />
                  <stop offset="100%" stop-color="#173f9b" />
                </linearGradient>
                <linearGradient id="aas-blue" x1="78" y1="22" x2="146" y2="108" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#2a8cff" />
                  <stop offset="100%" stop-color="#0057ff" />
                </linearGradient>
                <linearGradient id="aas-bar" x1="54" y1="80" x2="132" y2="80" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#0f6fff" />
                  <stop offset="100%" stop-color="#1f8cff" />
                </linearGradient>
              </defs>
              <path d="M28 104 L72 22 H88 L44 104 Z" fill="url(#aas-dark)" />
              <path d="M88 22 L132 104 H116 L88 48 L72 22 Z" fill="url(#aas-blue)" />
              <path d="M60 72 H118 C123 72 127 76 127 81 C127 86 123 90 118 90 H60 C55 90 51 86 51 81 C51 76 55 72 60 72 Z" fill="url(#aas-bar)" />
              <rect x="123" y="77" width="14" height="14" rx="3" fill="#0c67f2" />
              <rect x="139" y="61" width="10" height="10" rx="2.4" fill="#1d88ff" />
              <rect x="151" y="46" width="8" height="8" rx="2" fill="#7fc2ff" />
            </svg>
          </span>
          <strong>아키텍처 스튜디오 : AAStudio</strong>
        </div>

        <div class="project-switcher-wrap">
          <div class="project-switcher" id="projectSwitcher">
            <div class="project-switcher__project" aria-label="Selected project">
              <span class="project-switcher__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <circle cx="7" cy="7" r="1.8" />
                  <circle cx="17" cy="7" r="1.8" />
                  <circle cx="7" cy="17" r="1.8" />
                  <circle cx="17" cy="17" r="1.8" />
                </svg>
              </span>
              <span id="projectSwitcherText">project-management</span>
            </div>
            <button class="project-switcher__toggle" id="projectSwitcherToggle" type="button" aria-expanded="false" aria-haspopup="menu" aria-label="Open project dropdown">
              <span class="project-switcher__caret" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M7 15l5 5 5-5" />
                  <path d="M17 9l-5-5-5 5" />
                </svg>
              </span>
            </button>
            <div class="project-dropdown" id="projectDropdown" hidden>
              <div class="project-dropdown__list" id="projectDropdownList" role="menu" aria-label="프로젝트 목록"></div>
              <button class="project-dropdown__create" id="createProjectDropdownBtn" type="button">+ New project</button>
            </div>
          </div>
        </div>

        <div class="topbar__actions" aria-label="헤더 도구">          
          <button class="topbar-icon" type="button" aria-label="Help"><i class="ri-question-line"></i></button>
          <button class="topbar-icon" type="button" aria-label="Notifications"><i class="ri-notification-3-line"></i></button>
          <button class="topbar-icon" type="button" aria-label="Console"><i class="ri-terminal-box-line"></i></button>
          <button class="topbar-icon topbar-icon--accent" type="button" aria-label="Profile"><i class="ri-user-3-line"></i></button>
        </div>
      </header>

      <div class="layout">
        <aside class="rail" aria-label="작은 아이콘 메뉴">
          <nav class="rail-menu" id="railMenu" aria-label="아이콘 메뉴"></nav>
        </aside>

        <section class="workspace" id="workspaceGrid" aria-label="작업 영역"></section>
      </div>
    </main>

    <div class="app-modal" id="commonModal" hidden>
      <div class="app-modal__backdrop" data-modal-close aria-hidden="true"></div>
      <section class="app-modal__panel" role="dialog" aria-modal="true" aria-labelledby="commonModalTitle" aria-describedby="commonModalDescription">
        <header class="app-modal__header">
          <div>
            <h3 id="commonModalTitle">제목 변경</h3>
            <p id="commonModalDescription">프로젝트 이름을 입력하세요.</p>
          </div>
          <button class="app-modal__close" type="button" data-modal-close aria-label="닫기">
            <i class="ri-close-line" aria-hidden="true"></i>
          </button>
        </header>
        <div class="app-modal__body">
          <label class="app-modal__field">
            <span>프로젝트명</span>
            <input id="commonModalInput" type="text" autocomplete="off" spellcheck="false" />
          </label>
        </div>
        <footer class="app-modal__footer">
          <button class="app-modal__button app-modal__button--ghost" type="button" data-modal-close>취소</button>
          <button class="app-modal__button app-modal__button--primary" type="button" id="commonModalConfirm">확인</button>
        </footer>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
